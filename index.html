<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Todo List</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <h1>Todo List</h1>

    <p id="notice" class="notice" role="status" aria-live="polite" hidden></p>

    <form id="create-form" class="create-form">
      <label for="title-input">Task title</label>
      <input type="text" id="title-input" name="title" autocomplete="off">
      <button type="submit">Add task</button>
    </form>

    <ul id="task-list" class="task-list"></ul>

    <button type="button" id="clear-completed-btn" class="clear-completed" disabled>Clear completed</button>
  </main>

  <script src="app.js"></script>
</body>
</html>
